<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>北邮课程表 · 界面预览（390×844）</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #f2f4f3;
        font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1d2b25;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.hint { margin: 0 0 18px; color: #6b7a73; font-size: 12px; }
      .row { display: flex; gap: 22px; flex-wrap: wrap; }
      .col { display: flex; flex-direction: column; }
      .label { font-size: 12px; color: #41544b; margin: 0 0 8px; font-weight: 600; }
      .label span { font-weight: 400; color: #7d8b85; }
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 28px;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(20, 45, 35, 0.14), 0 0 0 1px rgba(20, 45, 35, 0.06);
      }
      .phone > iframe { width: 390px; height: 844px; border: 0; display: block; }
    </style>
  </head>
  <body>
    <h1>课表页简化对照（真实渲染，不是设计稿）</h1>
    <p class="hint">
      两个 iframe 都是本机跑起来的真实应用（<code>?demo=1</code> 载入示例课）。重点看三处：周次只出现一次、提示压成一行细条、课程块只留课程名 + 房间号。
    </p>
    <div class="row">
      <div class="col">
        <div class="label">课表 · 周视图 <span>（示例数据）</span></div>
        <div class="phone"><iframe src="/?demo=1#/timetable"></iframe></div>
      </div>
      <div class="col">
        <div class="label">导入页 <span>（未改动，供对比）</span></div>
        <div class="phone"><iframe src="/?demo=1#/import"></iframe></div>
      </div>
    </div>
  </body>
</html>
